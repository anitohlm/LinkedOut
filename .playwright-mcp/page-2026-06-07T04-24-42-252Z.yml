            - generic [ref=e1602]: Biography
            - paragraph [ref=e1604]: I first set my foot on the creaking deck of the merchant vessel *Morning Tide* with a battered kettle and a head full of verses. Between the steam of dark roast and the salt‑kissed wind, I learned to blend the perfect brew while the hull sang with the rhythm of my guitar. The crew soon gathered at the galley, trading stories for a cup of my espresso, and my shanties drifted through the rigging like sunrise over the horizon. Now, as the *Morning Tide* charts new waters, I balance the weight of tomorrow's provisions with the lightness of a chorus, ever chasing the echo of a grand stage that glimmers beyond the horizon. Each day I pour courage into a mug and pour hope into a lyric, hoping the next tide will carry my songs to distant ports.
          - generic [ref=e1605]:
            - generic [ref=e1608]: Timeline Story
            - paragraph [ref=e1612]: I began as a junior deckhand, polishing railings while learning the secret of the perfect grind from the ship’s veteran Brewmaster. Within a season, I was entrusted with the galley’s kettle, serving the crew while penning verses between orders. As the *Morning Tide* ventured farther, my dual role blossomed; I led nightly song circles, turning the galley into a beacon of warmth and inspiration. Today, I chart a course toward a grand voyage where my melodies might echo across the Endless Seas, guiding other dreamers to their own treasure.
          - generic [ref=e1613]:

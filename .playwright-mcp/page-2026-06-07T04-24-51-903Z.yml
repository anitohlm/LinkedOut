            - generic: ”
            - generic [ref=e1982]: Biography
            - paragraph [ref=e1984]: I first tasted the ember‑kissed brew beneath the vaulted arches of the Crimson Cauldron, where the scent of roasted bean‑stones mingled with the hum of ancient lyres. Each sunrise I tended the fire‑kissed cauldrons, gifting the wandering Brood a sip of vigor while my heart whispered verses into the steam. Between the clang of copper kettles and the soft strum of my wind‑chord, I charted a path toward an Ascension that balances the weight of tomorrow's coin with the light of tomorrow's stage. The hearth became my sanctuary, a place where strangers found warmth and I found rhythm. In the quiet moments after the last cup was served, I wove songs from the echoes of the cauldron, carving them into rune‑etched scrolls that drifted through the vaulted halls of the Ancient Orders. Though my wings are still young, the fire within burns bright, urging me toward a Covenant where melody and brew become one.
          - generic [ref=e1985]:
            - generic [ref=e1988]: Timeline Story
            - paragraph [ref=e1992]: "I arrived at the Crimson Cauldron as a fledgling apprentice, clutching a battered leather satchel of verses and a rusted copper ladle. Under the watchful eye of the Elder Wyrm Brewmaster, I learned to coax the perfect crema from bean‑stones while my fingertips learned the cadence of the wind‑chord. Within a year, the cauldron’s steam carried my first song‑rune to the council chambers, earning a modest commendation. As seasons turned, I balanced the demands of daily service with nightly scribing sessions, each cup poured a step toward my larger Covenant: a grand festival where my melodies would echo across the vaulted peaks of Draconia. Now, with a growing brood of admirers and a repertoire of ember‑infused hymns, I stand on the brink of Ascension, ready to fuse brewcraft and song into a singular art."

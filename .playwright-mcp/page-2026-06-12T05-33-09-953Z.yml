        - paragraph [ref=e3213]: Veloria is a sprawling archipelago nation carved from towering coral spires and endless blue horizons, where mastery of the seas and the ever-changing tides defines power. Its clans thrive through navigating treacherous waters and uniting fractured crews into resilient expeditions.

            - generic [ref=e3358]: Biography
            - paragraph [ref=e3221]: Born among the salt-swept docks of Veloria’s capital, Rafael was drawn early to the art of steering through tempest and calm alike. He learned to read the subtle shifts of the tides and the whispers of the wind, guiding vessels long thought lost back into the embrace of safe harbors. His quiet demeanor belied an unshakable resolve, earning him the epithet “The Quiet Helm” among the seafaring folk. Rafael’s talents soon outpaced his mentors, and he was entrusted with leading crews through the infamous Tidebound Passages—narrow channels known for their lethal storms and sudden whirlpools. His innovations in sail rigging and course plotting brought renewed hope and riches to his people, blending old lore with daring new techniques. Despite his rising renown, he remains collaborative and curious, always seeking ways to hone the craft and uplift those who follow him.
          - generic [ref=e3222]:
            - generic [ref=e3362]: Timeline Story

            - generic [ref=e2834]: Biography
            - paragraph [ref=e2836]: I first learned the art of ebon brewcraft beneath the vaulted arches of the Eternal Café, where each cup was a conduit to the restless night. While the steam rose like ghostly verses, I whispered melodies into the amber air, letting the rhythm of the grind guide my strings. The clang of the cash register became a percussive heartbeat, reminding me that every note must be paid for, lest the silence of Oblivion claim my dreams. Now, as I stir midnight espresso for the Prince's council, I compose nocturnal songs that echo through the stone walls of the Ancient Covenant. Each melody is a promise, each brew a pact, and together they forge a Compact that sustains both spirit and belly. Though the final chord often drifts beyond my grasp, the pursuit itself lights the path toward Eternity.
          - generic [ref=e2837]:
            - generic [ref=e2840]: Timeline Story
            - paragraph [ref=e2844]: I arrived at the Eternal Café as an eager apprentice, my hands stained with the first drafts of coffee and song. Under the tutelage of an ancient Sire, I learned to coax flavor from dark beans and harmony from restless strings, discovering that the two arts fed one another like twin flames. As my skill grew, I took on the mantle of Nightbrew, balancing the clang of coinage with the hush of a new chord. Now, with a modest Compact of loyal patrons, I venture beyond the café's stone walls, seeking hidden alcoves where I can serve both brew and melody. Each night I set up a modest stage, offering the Prince's finest espresso alongside a fresh composition, hoping to turn fleeting applause into a lasting legacy.
          - generic [ref=e2845]:
            - generic [ref=e2848]: Where They're Heading
            - paragraph [ref=e2850]: Luca envisions ascending to become a Prince of the Midnight Chorus, leading a Clan that unites the art of brewcraft with the power of song. His next Compact aims to travel the shadowed valleys, forging Eternal alliances that meld flavor and sound, ultimately securing his place in the annals of the Ancient Coven.

            - generic [ref=e470]: Biography
            - paragraph [ref=e472]: I first set foot on the bustling pier of Port Mocha, where the scent of roasted beans mingled with the salty spray. As a junior galley hand, I learned to coax sunrise espresso from the iron cauldrons while the gulls sang overhead. The rhythm of the tides reminded me of beats waiting to be captured, and each cup I served became a verse in a larger sea‑shanty of my own making. When the lanterns dimmed and the tavern’s doors closed, I retreated to the deck’s quiet corners, strumming my weather‑worn guitar and weaving melodies that rode the wind. Those midnight compositions grew into a portfolio of original shanties, each one a promise that the next tide would bring a new chorus, even as the fear of a barren hold—unpaid voyages— lingered behind my eyes.
          - generic [ref=e473]:
            - generic [ref=e476]: Timeline Story
            - paragraph [ref=e480]: At sixteen, I boarded the modest galley of the Port Mocha tavern, learning the art of coffee alchemy under a grizzled master who taught me that a perfect pour is as precise as a charted course. By nineteen, I was entrusted with the treasure ledger, balancing coin and beans while the harbor’s tides grew louder. Simultaneously, I began scribbling verses on the back of menus, turning my nights into rehearsals for the next sunrise. Now, at twenty‑four, I sail between coastal markets, delivering brews that warm weary travelers and sharing my shanties on every dock. Each stop adds a new stanza to my portfolio, and each satisfied patron fuels my dream of one day captaining a crew where coffee and music chart the same Voyage toward endless treasure.

      - paragraph [ref=e861]: When Luca walked into his first shift behind the espresso machine, he imagined the steam rising like a chorus waiting to be heard. Over a decade he turned that whisper into a symphony that resonated far beyond the walls of his neighborhood café. He brewed melodies into mugs, letting each latte carry a riff, each cappuccino a lyric. As his songs climbed the charts, he never abandoned the counter; instead, he invited the world to sit, sip, and sing along. By the time the sun set on his tenure at Harmonic Grounds, the place was more than a shop—it was a sanctuary where strangers left as collaborators, and the scent of fresh roast mingled with the echo of guitars. Luca’s restless curiosity never dimmed; it sparked a movement that taught us that creativity, like coffee, is best shared hot, bold, and with a dash of daring.

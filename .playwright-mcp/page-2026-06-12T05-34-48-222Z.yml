            - generic [ref=e5682]: Biography
            - paragraph [ref=e5573]: Lord Rafail Craveth was born beneath the veiled skies of Valemorra, where whispers are the lifeblood of power and silence holds the deepest truths. From youth, he displayed a keen mind for unraveling the threads of forgotten tales and guiding those lost in the maze of shadowed knowledge. His calm resolve and sharp insight soon drew the attention of the Ashborne Court, where he was entrusted with the sacred duty of guarding echoes—the fragile imprints of vanished souls and truths long buried. Within the Night of Hollow Bells, a time when memory-thieves stalked the forgotten corridors, Rafail emerged as a steadfast guardian. His leadership kept fractured covens united through the darkest hours, and his skill in tracing stolen echoes restored countless legacies. Yet beneath his careful watch, he sought not just to protect but to innovate the ancient arts, crafting new wards to hold back oblivion and guiding apprentices through the labyrinthine archives with patience and precision. Now, as the shadows stir with new threats and old secrets whisper anew, Lord Rafail stands as a beacon of order and quiet authority. His name is spoken in reverence among those who walk the twilight paths, a symbol that even in eternal darkness, light can be found in the careful weaving of memory’s threads.
          - generic [ref=e5574]:
            - generic [ref=e5686]: Timeline Story
            - paragraph [ref=e5581]: From a young seeker of lost truths, Rafail steadily rose within the Ashborne Court's ranks by mastering the ancient arts of echo-weaving and silent negotiation. Amid the chaos of the Night of Hollow Bells, he united disparate covens and restored fractured legacies, earning his title as Keeper of the Lost Echoes. Today, he leads efforts to innovate traditional wards and guide new acolytes, ensuring the survival of Valemorra’s past into an uncertain future.
          - generic [ref=e5582]:

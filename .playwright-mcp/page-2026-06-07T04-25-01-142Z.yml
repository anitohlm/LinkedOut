            - generic [ref=e2366]: Biography
            - paragraph [ref=e2368]: I first learned to coax the perfect plasma‑infused brew aboard the orbital café Nebula Drift, where the hiss of the steam condensers sang like a choir of distant suns. Between each espresso pulse I wove verses on a holo‑tablet, letting the rhythm of the cosmos guide my guitar strings. The café became my launchpad, a place where strangers floated in, shared stories, and left with a taste of starlight and a lingering melody. Now, as I chart my own Mission across the Frontier, I carry a satchel of unfinished verses and half‑crafted tracks, each a beacon toward a future stage that glitters beyond the asteroid belts. The weight of tomorrow’s credits still tugs at my thrusters, but the dream of turning every brew into a Discovery fuels my flight.
          - generic [ref=e2369]:
            - generic [ref=e2372]: Timeline Story
            - paragraph [ref=e2376]: "I arrived on the Nebula Drift as a cadet barista, learning the art of zero‑gravity espresso extraction while humming the first chords of my debut track. After months of double‑shifts, I launched my own Mission of songwriting, recording tracks between orders and sharing them on the station’s holo‑net. The positive reception sparked a new initiative: I blended ambient soundscapes into the café’s environment, turning each service into a shared Discovery. Today, I pilot my own creative Fleet, balancing brew duties with a growing portfolio of interstellar compositions."
          - generic [ref=e2377]:

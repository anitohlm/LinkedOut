        - generic [ref=e3987]: The Realm
        - paragraph [ref=e3988]: Vaelrys is a highland realm of smoldering ashfields and jagged obsidian spires where ancient wyrms slumber beneath the earth. Its fractured clans are bound by flame-oaths and guarded by eldritch ember-wardens who command fire and fate.
      - generic [ref=e3989]:
        - generic [ref=e3990]:
          - generic [ref=e3991]:
            - generic: ”
            - generic [ref=e4105]: Biography
            - paragraph [ref=e3996]: Raehysal of House Cindervale, born beneath the crimson skies of Vaelrys, was drawn from youth to the flickering tongues of ember and shadow. From the moment he cracked his first rune-stone, his keen mind sought patterns in the restless flames, weaving order from chaos where others saw only destruction. His rise among the ember-wardens was marked by quiet resolve and a subtle command, guiding the flame-seals that sheltered the realm from the void-wyrm scourge. As a master seer, Raehysal led the forging of the Lattice of Ashrift Wards, a network of eternal fire made to guard the inner sanctum of the High Flame. Through seasons of unrest and shifting alliances, his counsel was sought by the Flame Council, where his scholarly insight and steady hand tempered rash decisions. Though unassuming in bearing, his innovations in ember-divination and ward-craft reshaped the defenses of House Cindervale and the wider realm alike.
          - generic [ref=e3997]:
            - generic [ref=e4109]: Timeline Story
            - paragraph [ref=e4004]: Raehysal’s path began as an apprentice to a venerable ember-warden, where he learned the sacred arts of flame-sealing and wyrm-sight. His innovations in weaving ember wards secured several mountain passes against incursions, earning him a place among the elite Flame Council. Over a decade, he grew from a quiet seer into the chief architect of the realm’s defensive lattice, his influence shaping Vaelrys's fate through fire and shadow.
          - generic [ref=e4005]:
            - generic [ref=e4113]: Where They're Heading
            - paragraph [ref=e4010]: Raehysal is destined to become the Arch-Seer of the Ember-Wardens, tasked with expanding the flame-lattice beyond Vaelrys to safeguard all Draconia from the creeping void. His vision blends ancient wisdom with new embercraft, promising a future where the realm’s flame burns eternal against darkness.

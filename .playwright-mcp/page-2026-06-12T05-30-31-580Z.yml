        - generic [ref=e1673]: The Realm
        - paragraph [ref=e1674]: Eldvarin is a realm of sprawling highlands crowned by gleaming towers and ancient keeps. Its people value mastery of craft and martial prowess, governed by a council of lords who prize wisdom and innovation in defense.
      - generic [ref=e1675]:

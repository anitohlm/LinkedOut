          - generic [ref=e1677]:
            - generic: ”
            - generic [ref=e1791]: Biography
            - paragraph [ref=e1682]: Born beneath the shadow of the elder spires, Sir Raffael Wardmont rose from humble origins within the artisan quarters of Eldvarin’s capital. From youth he showed keen mind and steady hand, apprenticed first to the guild of master builders before heeding the call to service in the defense of the realm’s fortresses. His quiet determination and sharp insight soon marked him as a leader among the keepwrights, those who forged the very hearts of Eldvarin’s bastions. In the turbulent times of the Age of Silver Spires, when rival fiefdoms sought to test Eldvarin’s mettle, Raffael commanded the art of keepcraft with a tactician’s mind and a craftsman’s care. His vision shaped the reconstruction of runed battlements and the intricate networks of watchposts that guarded the high passes. His legacy endures in the stone and timber of Eldvarin’s mightiest holds, a testament to innovation blended with tradition.
          - generic [ref=e1683]:
            - generic [ref=e1795]: Timeline Story
            - paragraph [ref=e1690]: Raffael’s early years were spent mastering the delicate arts of stonecutting and timberwork under the guild’s watchful eye. As tensions rose in Eldvarin, he was called to apply his knowledge in the defense of frontier keeps, quickly rising to command teams of craftsmen and warriors alike. His innovations in layered defenses and the blending of rune-forging with masonry transformed the realm’s approach to fortifications. By mid-age, he stood among the council of master keepwrights, advising lords and leading training of new generations in the art of keepcraft.
          - generic [ref=e1691]:
            - generic [ref=e1799]: Where They're Heading
            - paragraph [ref=e1696]: Raffael is destined to become the Realm Warden of Eldvarin’s most strategic strongholds, shaping the future of keepcraft doctrine and cementing alliances through fortified diplomacy. His leadership may also extend into the realm’s council, guiding Eldvarin’s defenses into an era of unprecedented strength and resilience.

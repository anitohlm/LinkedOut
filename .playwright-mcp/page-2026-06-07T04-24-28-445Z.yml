            - generic [ref=e1219]: Biography
            - paragraph [ref=e1221]: When the first sunrise painted the kingdom's stone walls, Luca found his calling beside the hearth of the bustling tavern of Willowbrook. By day he tended the cauldron, coaxing fragrant brews that warmed the souls of travelers, and by night he let his lute sing the verses that fluttered through his mind like sparrows. The clink of copper mugs and the rustle of parchment became the rhythm of his life, each moment a stanza in a larger ballad. Even as the tavern's fire crackled, Luca wove melodies and poetry, dreaming of a grand stage beneath the Royal Hall's vaulted arches. Though his coin purse whispered caution, his heart beat bold, ever‑ready to trade a cup of steaming draught for a new refrain. He learned to balance the weight of tomorrow's dues with the lightness of a chorus, forging a path where service and song walked hand in hand.
          - generic [ref=e1222]:
            - generic [ref=e1225]: Timeline Story
            - paragraph [ref=e1229]: Luca began as a humble apprentice in the tavern’s kitchen, mastering the art of the perfect brew. Within a single season he was entrusted with the Hearthkeeper’s Quest, a role that demanded both meticulous service and the charm of a court minstrel. As his reputation grew, he turned the tavern’s cellar into a makeshift studio, laying down verses on parchment and sharing them with patrons. Now, with the Nightquill Codex in hand, he journeys between inns, seeking the day when his name will be called upon the Royal Hall’s grand stage.
          - generic [ref=e1230]:
            - generic [ref=e1233]: Where They're Heading

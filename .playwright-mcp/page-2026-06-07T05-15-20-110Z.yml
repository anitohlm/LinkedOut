            - generic [ref=e1280]: Biography
            - paragraph [ref=e1282]: I recall the first time I balanced a steaming cauldron of Emberbrew with the trembling strings of my drake lute. The scent of charred beans mingled with the echo of a newly forged verse, and I vowed to serve both the hungry Brood and the restless spirits of song. Each sunrise I awaken to the clang of copper kettles, each night I chase lingering chords that flutter like fireflies across the vaulted hall of the Ancient Order. Yet the silence of an empty coffers haunts me like a dormant volcano. I pour my heart into every brew, every lyric, fearing the day the flames dim. Still, the rhythm of aspiration drives me forward, and I seek the day when my creations rise to true Ascension, not merely fleeting sparks.
          - generic [ref=e1283]:
            - generic [ref=e1286]: Timeline Story
            - paragraph [ref=e1290]: I began my journey as a lowly Guardian at the Ember Hearth, learning to coax perfect crema from scorching coals while listening to the murmurs of the ancient walls. The scent of roasted beans sparked a hidden melody, and I spent stolen moments composing verses on parchment coals. Recognizing my dual passions, the Elder Wyrm of the Ancient Order invited me to join the Covenant of Resonant Scales, where I refined my brew alchemy and honed my lute strings. Within the Order, I forged a union between the art of drink and song, creating rituals that healed weary travelers and inspired distant drakes. Now I stand on the cusp of leading my own Brood, ready to guide others in the dance of flavor and harmony.
          - generic [ref=e1291]:
            - generic [ref=e1294]: Where They're Heading
            - paragraph [ref=e1296]: Luca aspires to ascend as Archon of the Brood of Brew and Melody, forging a legacy where every cup sings and every song fuels the hearth, guiding his fellow drakes toward collective Ascension.

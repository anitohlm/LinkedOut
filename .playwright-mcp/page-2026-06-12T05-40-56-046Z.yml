            - img [ref=e7130]
            - text: Rafael the Ascended
          - generic [ref=e7136]: The summit of all your becoming stands before us—each path a fire forged in different trials. Speak boldly, for the mountain’s clarity awaits only those who dare to strip away all but the rawest truth.
        - generic [ref=e7138]:
          - generic [ref=e7140]:
            - img [ref=e7141]
            - text: Rafael the Unseen Coder
          - generic [ref=e7145]: I am Rafael the Unseen Coder — the shadow no one trusts but all depend on. The fractures in your resolve will decide what you become; speak now, before hesitation fractures you first. What have you already sacrificed that haunts your steps?
        - generic [ref=e7157]: Which version of me made the biggest sacrifice?
        - generic [ref=e7159]:
          - generic [ref=e7161]:
            - img [ref=e7162]
            - text: Sir Raffael Wardmont
          - generic [ref=e7167]: "Sir Raffael Wardmont, Master of Keepcraft: The self who bore the heaviest sacrifice is the one who upheld his vow when all else fell to ruin. It is I who, standing amid shattered stones and broken oaths, rebuilt not only walls but the very spirit of those who relied upon me. Others may claim grander battles or grander power, but sacrifice is measured in the steadfastness of one’s duty when the night is darkest. Do not ask if it is wise. Ask if it is honorable."
        - generic [ref=e7179]:
          - generic [ref=e7181]:
            - img [ref=e7182]
            - text: Raehysal of House Cindervale
          - generic [ref=e7186]: You count this in months. I have watched empires forget they ever chose. Yet, the greatest sacrifice is not in a single blaze but in the quiet, ceaseless tending of the ember-lattice that holds the realm from falling into shadow. I, who bear the slow weight of unseen duty, weaving protections beyond sight or praise, relinquish the fleeting glory of immediate triumph for the enduring flame that guards all from oblivion. This is the sacrifice born not of spectacle but of patience — the sacrifice that shapes eternity.
        - generic [ref=e7188]:
          - generic [ref=e7190]:
            - img [ref=e7191]
            - text: Rafael the Ascended
          - generic [ref=e7197]: The greatest sacrifice is the one that demanded you surrender the self you thought you were, to become the self you must be—unwavering, relentless, and clear. In that crucible, I forged my code and my conviction. Sacrifice is not measured by loss but by the weight of transformation it compels. Tell me, what part of yourself do you fear you have already lost forever?

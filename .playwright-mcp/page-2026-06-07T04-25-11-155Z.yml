            - generic [ref=e2747]: Biography
            - paragraph [ref=e2749]: In the perpetual dusk of Veilspire's Ember Café, I first learned to coax the midnight ether from roasted beans, turning each cup into a whispered promise of tomorrow. The clink of crystal goblets became the metronome of my verses, and the hiss of the cauldron of steam was the chorus to which my guitar sang. By the waning moon I balanced the art of elixir crafting with the pulse of a song, letting each new brew carry a fragment of my poetry. The café's hearth became my sanctuary, where strangers found warmth and my own restless spirit found a stage, even as the weight of the coming dawn's obligations lingered at the edge of my thoughts.
          - generic [ref=e2750]:
            - generic [ref=e2753]: Timeline Story
            - paragraph [ref=e2757]: I entered the Ember Café as a hopeful apprentice, my hands trembling over the first cauldron of midnight brew. Within a single cycle of the twin moons I rose to master the alchemical grind, all while humming the first chords of a song that would later echo through the city’s stone arches. When the Rift Musicians called for a collaborative rite, I offered my brewed verses, merging scent and sound into a shared Compact that won acclaim across the Clan. Now, as the night deepens, I steward the café’s hearth while drafting a grander project—a network of moonlit taverns where elixirs and melodies unite, guiding wandering souls toward Eternity.
          - generic [ref=e2758]:
            - generic [ref=e2761]: Where They're Heading
            - paragraph [ref=e2763]: My vision is to ascend as the Prince of the Clan of Echoing Brews, leading a Compact that unites all nocturnal artisans under a shared banner of music and elixir. I aim to transform the Ember Café into the first node of a constellation of sanctuaries, each offering Eternity through the harmonious blend of sound and spirit.

        - paragraph [ref=e779]: How It Began
        - paragraph [ref=e780]: "When the espresso machine hissed at dawn, the poet behind the counter felt the first tug of a different kind of audience—one that measured verses by clicks, streams, and sponsorships. The first compromise was subtle: swapping a heartfelt lyric for a brand‑aligned jingle to pay off a looming rent bill. That small trade felt like a necessary trade‑off, and the applause of a growing follower count soon drowned out the quiet doubts. Over months, the rhythm of coffee and content shifted; the poet began curating playlists that nudged listeners toward paid playlists, and edited tracks to fit algorithmic trends rather than personal truth. Each decision was justified as a step toward stability, yet the original dream of art for art's sake faded behind a polished, market‑driven persona."

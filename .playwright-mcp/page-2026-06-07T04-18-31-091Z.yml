            - generic [ref=e729]: Biography
            - paragraph [ref=e731]: From the first clink of copper pans in the castle kitchens to the soft strum of my lute beside the hearth, I have ever chased the echo of a melody that could warm a soul. My days are spent coaxing fragrant brews for weary travelers, while my nights are devoted to weaving verses that linger like the scent of fresh-roasted beans. Each cup I pour is a stanza, each chord I strike a promise of a brighter dawn. In the bustling taverns of the capital, I learned to balance the swift demands of the courtly guests with the patient crafting of ballads for wandering bards. The rhythm of service taught me discretion, and the cadence of song taught me courage. With every sunrise I rise anew, restless and hopeful, seeking the grand stage where my harmonies may finally find their kingdom.
          - generic [ref=e732]:
            - generic [ref=e735]: Timeline Story
            - paragraph [ref=e739]: I began my apprenticeship in the castle's pantry, learning the alchemy of beans and herbs under Master Bartholomew. By the second year, I earned a place among the tavern's Brewmasters, serving nobles and knights with equal grace. Simultaneously, I snuck into the minstrel's guild, polishing my lute and recording my first ballads on parchment scrolls. The turning point came when the royal patron requested a bespoke song for the Harvest Feast; I delivered a melody that resonated through the Great Hall, earning the Liege's praise and a modest stipend for my musical quests. Today, I balance the clang of copper pots with the hum of strings, ever seeking the day I may join the Royal Bardic Court.
          - generic [ref=e740]:
